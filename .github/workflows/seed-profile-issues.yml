name: Seed profile issues

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/seed-profile-issues.yml
      - .github/scripts/seed-profile-issues.sh

permissions:
  contents: read
  issues: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create labels, starter issues, and project board
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/seed-profile-issues.sh
